# AgentForge Docker Compose — local dev/test

version: "3.9"

services:
  agentforge:
    image: agentforge/agentforge:latest
    container_name: agentforge
    restart: unless-stopped
    ports:
      - "8080:8080"   # REST / dashboard
      - "9090:9090"   # MCP server
      - "9091:9091"   # gRPC API
    volumes:
      - ./data/memory:/app/data/memory
      - ./data/logs:/app/data/logs
      - ./config.yaml:/app/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock  # optional: for docker tool
    environment:
      AGENTFORGE_CONFIG: /app/config.yaml
      AGENTFORGE_HOME: /app/data
      RUST_LOG: info
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
